<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f9fd" />
  <title>전례 봉사 일정</title>
  <link rel="stylesheet" href="styles.css?v=20260921-5" />
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <div>
        <h1>전례 봉사 일정</h1>
        <p id="updatedText" class="updated-text"></p>
      </div>
      <div class="header-actions">
        <a class="button button-secondary button-link" href="attendance.html">출석부</a>
        <button id="editButton" class="button button-primary" type="button">수정</button>
        <button id="saveButton" class="button button-primary hidden" type="button">저장</button>
        <button id="cancelButton" class="button button-secondary hidden" type="button">취소</button>
      </div>
    </header>

    <section class="schedule-card" aria-labelledby="scheduleHeading">
      <h2 id="scheduleHeading" class="visually-hidden">2026년 전례 봉사 일정</h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col">날짜</th>
              <th scope="col">해설</th>
              <th scope="col">1독서</th>
              <th scope="col">2독서</th>
              <th scope="col">반주</th>
              <th scope="col">드럼</th>
            </tr>
          </thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>

    <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
  </main>

  <dialog id="passwordDialog" class="password-dialog">
    <form id="passwordForm" method="dialog" class="password-card">
      <div class="dialog-title-row">
        <h2>일정 수정</h2>
        <button id="dialogClose" class="icon-button" type="button" aria-label="닫기">×</button>
      </div>
      <label for="passwordInput">비밀번호</label>
      <input id="passwordInput" name="password" type="password" autocomplete="current-password" required />
      <p id="passwordError" class="form-error" aria-live="polite"></p>
      <button class="button button-primary button-full" type="submit">확인</button>
    </form>
  </dialog>

  <script src="app.js?v=20260921-4" defer></script>
</body>
</html>
